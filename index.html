<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Bütçe Takibi</title>
</head>
<body>
  <div class="uygulama_alani">
    
    <!-- Bakiye Bölmesi -->
    <div class="bakiye_penceresi">
      <h1>Bakiye</h1>
      <h2><span id="bakiye">0</span> TL</h2>
    </div>

    <!-- Gelir Gider Tablosu -->
    <div class="gelir_gider_tablosu">
      <div class="gelir">
        <h3>Gelir</h3>
        <p class="gelen-miktar" id="gelen-miktar">+0.00 TL</p>
      </div>
      <div class="gider">
        <h3>Gider</h3>
        <p class="giden-miktar" id="gider-miktar">-0.00 TL</p>
      </div>
    </div>

    <!-- İşlem Geçmişi -->
    <div class="islem_gecmisi">
      <h2>İşlem Geçmişi</h2>
      <ul id="islemler" class="islemler">
        <!-- Dinamik olarak dolacak -->
      </ul>
    </div>

    <!-- İşlem Ekleme Formu -->
    <form id="form">
      <h2>İşlem Ekle</h2>
      
      <div class="form-control">
        <label for="islem_adi">İşlem Adı</label>
        <input type="text" id="islem_adi" placeholder="Örn: Market, Kira, Maaş...">
      </div>

      <div class="form-control">
        <label for="islem_turu">İşlem Türü</label>
        <select id="islem_turu">
          <option value="gelir">Gelir</option>
          <option value="gider" selected>Gider</option>
        </select>
      </div>

      <div class="form-control">
        <label for="kategori">Kategori</label>
        <select id="kategori">
          <option value="Genel">Genel</option>
          <option value="Mutfak & Market">Mutfak & Market</option>
          <option value="Faturalar">Faturalar</option>
          <option value="Ulaşım">Ulaşım</option>
          <option value="Eğlence & Sosyal">Eğlence & Sosyal</option>
          <option value="Maaş & Ek Gelir">Maaş & Ek Gelir</option>
        </select>
      </div>
      
      <div class="form-control">
        <label for="miktar">Miktar (Sadece sayı giriniz)</label>
        <input type="number" id="miktar" placeholder="Örn: 500">
      </div>
      
      <button type="submit" class="btn">İşlem Ekle</button>
    </form>
    
  </div>
  
  <script src="script.js"></script>
</body>
</html>
